[package]
name = "starter"
version = "0.3.0"
edition = "2024"
description = "A keyboard-first desktop launcher for macOS and Windows"
license = "MIT"
rust-version = "1.90"

[dependencies]
anyhow = "1"
async-channel = "2"
dirs = "7"
file_icon_provider = "1.0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
global-hotkey = "0.8"
grep-regex = "0.1"
grep-searcher = "0.1"
gpui-kit = "0.7.1"
ignore = "0.4"
nucleo-matcher = "0.3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
toml = "1.1"
tray-icon = "0.26"
raw-window-handle = "0.6"
ureq = "3"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSPropertyList", "NSError"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Foundation"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
