[package]
name = "starter"
version = "0.3.0"
edition = "2024"
description = "A keyboard-first desktop launcher for macOS and Windows"
license = "MIT"
rust-version = "1.90"

[dependencies]
anyhow = "1"
async-channel = "2"
dirs = "7"
file_icon_provider = "1.0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp", "ico", "pnm"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
global-hotkey = "0.8"
grep-regex = "0.1"
grep-searcher = "0.1"
gpui-kit = "0.7.1"
ignore = "0.4"
nucleo-matcher = "0.3"
open = "5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
strsim = "0.11"
toml = "1.1"
tray-icon = "0.26"
raw-window-handle = "0.6"
ureq = "3"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString", "NSPropertyList", "NSError", "NSArray", "NSURL", "NSFileManager", "NSAppleEventDescriptor", "NSDate", "NSBundle", "objc2-core-services"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Security"] }
winrt-notification = "0.5"
winreg = "0.55"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
